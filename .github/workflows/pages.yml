# GitHub Pages: публикует готовую сборку site/ (сайт гостя в корне, команда — team.html, admin/, app/, link/).
# Сборка — локально: cd server && DEMO_OUT=../site DEMO_SITE=guest DEMO_NS=sutki-pro-booking node scripts/build-static-demo.js
name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
